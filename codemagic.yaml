# Cloud iOS build for UroApp — builds on a Codemagic Mac and uploads to TestFlight,
# so no local Mac is needed.
#
# BEFORE THE FIRST RUN (one-time, in this order):
#   1. Apple Developer Program enrolment approved.
#   2. App Store Connect → create the app record with bundle ID com.uroapp.clinical.
#      Copy its numeric "Apple ID" into APP_STORE_APPLE_ID below.
#   3. App Store Connect → Users and Access → Integrations → create an API key
#      (App Manager role). Add it in Codemagic → Teams → Integrations →
#      Developer Portal, and put the name you give it in `app_store_connect` below.
#   4. Codemagic → this app → Environment variables → create the group "uroapp_app"
#      with VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (from Supabase →
#      Project Settings → API). The group must exist even while it is empty.
#      Subscriptions, once the products are live (docs/PUBLISHING.md): add
#      VITE_REVENUECAT_IOS_KEY (public key, appl_…), VITE_PRIVACY_URL, and
#      VITE_PAYWALL=on. The build stops if the paywall is on without the other two.
#   5. Connect the GitHub repo in Codemagic and start the "ios-testflight" workflow.
#
# Notes on deviations from Codemagic's own Capacitor example, which assumes
# CocoaPods and agvtool:
#   - Capacitor 8 generated a Swift Package Manager project (ios/App/CapApp-SPM),
#     so there is no `pod install` and the build targets App.xcodeproj, not an
#     .xcworkspace.
#   - The project has no VERSIONING_SYSTEM, so agvtool would fail. The build
#     number is passed to xcodebuild as CURRENT_PROJECT_VERSION instead, which
#     Info.plist reads for CFBundleVersion.
#   - Build numbers come from TESTFLIGHT, not the App Store: until the app is
#     released the App Store has no builds, so the App Store lookup would hand
#     every upload the same number and TestFlight would reject the duplicate.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: UroApp ASC key # ← name of the API key added in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.uroapp.clinical
      groups:
        - uroapp_app # build-time VITE_* settings (accounts, subscriptions); see step 4 above
      vars:
        APP_STORE_APPLE_ID: 6829262342 # numeric Apple ID of the app record ("UroApp – Urology Guide")
      node: 24.16.0 # matches the local toolchain
      xcode: 27.1 # needed for full screen on iPhone Duo (Apple: Xcode 26 builds don't fill it)
    triggering:
      events:
        - tag # build on a pushed tag (e.g. v1.0.0-b3), not on every commit
    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Check subscription settings
        script: |
          # Guideline 3.1.2: a build that sells subscriptions must link the privacy policy,
          # and without the RevenueCat key nothing could be bought or restored.
          if [ "${VITE_PAYWALL:-}" = "on" ]; then
            [ -n "${VITE_REVENUECAT_IOS_KEY:-}" ] || { echo "VITE_PAYWALL=on needs VITE_REVENUECAT_IOS_KEY"; exit 1; }
            [ -n "${VITE_PRIVACY_URL:-}" ] || { echo "VITE_PAYWALL=on needs VITE_PRIVACY_URL"; exit 1; }
            case "$VITE_REVENUECAT_IOS_KEY" in appl_*) ;; *) echo "VITE_REVENUECAT_IOS_KEY must be the public iOS key (appl_…)"; exit 1 ;; esac
          fi

      - name: Typecheck, lint and test
        script: |
          npm run typecheck
          npm run lint
          npx vitest run

      - name: Build web assets
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((LATEST + 1))
          # BUILD_NUMBER is Codemagic's per-workflow counter; take the higher of the two.
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "Building with CFBundleVersion $NEXT"
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --archive-flags="CURRENT_PROJECT_VERSION=$NEXT"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Runs the app in the iPhone Duo simulator and saves screenshots as artifacts —
  # a check for the foldable without owning one. No signing, no upload; start it
  # by hand in Codemagic. Needs only the GitHub repo connected.
  ios-duo-simulator:
    name: iPhone Duo simulator check
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 24.16.0
      xcode: 27.1 # "latest" still resolves to Xcode 26 here, which has no Duo simulator
    scripts:
      - name: Build web assets and sync
        script: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Build for the simulator
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | tail -n 20

      - name: Run on iPhone Duo and take screenshots
        script: |
          set -e
          mkdir -p duo-shots
          xcrun simctl list devicetypes > duo-shots/devicetypes.txt
          TYPE=$(xcrun simctl list devicetypes | grep -i "iPhone Duo" | head -n 1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
          [ -n "$TYPE" ] || { echo "No iPhone Duo simulator in this Xcode"; cat duo-shots/devicetypes.txt; exit 1; }
          UDID=$(xcrun simctl create "Duo check" "$TYPE")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim/Build/Products -name "App.app" -maxdepth 3 | head -n 1)
          xcrun simctl install "$UDID" "$APP"
          # Skip the first-launch disclaimer for the shots (Capacitor Preferences = UserDefaults).
          xcrun simctl spawn "$UDID" defaults write com.uroapp.clinical \
            CapacitorStorage.uroapp.disclaimer.v2 '"2026-11-01T00:00:00.000Z"'
          # Let SpringBoard settle first: an early launch landed on the home screen.
          sleep 45
          xcrun simctl spawn "$UDID" log stream --style compact \
            --predicate 'process == "App"' > duo-shots/app-log.txt 2>&1 &
          LOGPID=$!
          xcrun simctl launch --terminate-running-process "$UDID" com.uroapp.clinical | tee duo-shots/launch.txt
          sleep 20
          kill $LOGPID 2>/dev/null || true
          # Is the app still running, or did it crash?
          xcrun simctl spawn "$UDID" launchctl list | grep -i uroapp > duo-shots/running.txt || echo "NOT RUNNING" > duo-shots/running.txt
          cp ~/Library/Logs/DiagnosticReports/App-*.ips duo-shots/ 2>/dev/null || true
          # Record which displays the simulator exposes, then shoot each one.
          xcrun simctl io "$UDID" enumerate > duo-shots/displays.txt 2>&1 || true
          xcrun simctl io "$UDID" screenshot duo-shots/default.png
          for D in internal external; do
            xcrun simctl io "$UDID" screenshot --display="$D" "duo-shots/$D.png" 2>>duo-shots/errors.txt || true
          done
          ls -la duo-shots

    artifacts:
      - duo-shots/*
